    <title>26-border-radius</title>
    <link rel="stylesheet" href="../src/css/style.css">
     <style>
        section {
            div {
                border: 4px solid #fff9;
                background-color: #ab7dd999;
                height: 150px;
                margin: 0 auto;
                width: 150px;
                &.bradius1 {
                    border-radius: 50%;
                }
                &.bradius2 {
                    border-radius: 40px 0;
                }
                &.bradius3 {
                    border-radius: 140px 0 0 140px;
                }
                &.bradius4 {
                    border-radius: 140px 0 140px 140px;
                }
                &.bradius5 {
                    border-radius: 80px;
                    corner-shape: squircle;
                }
            }
        }
    </style>
</head>
