<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-pseudoclasses</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        /* :link |:hover |:active |:visited */
        .options {
            a:link, a :visited {
            background-color: #fff9;
            color:#0009;
            padding: 0.4rem 0.8rem;
        }
        a:hover {
            background-color: #663399;
            color:#fff9
        }
        a:active {
            background: color #dc143c;
            color:#fff9
        }
        a:first-child {
            opacity: 0.5;
            pointer-events: none;
        }
      }
      /* focus, :blur */
      input {
      padding: 0.4rem;
      margin-top: 0.4rem;
      &:focus {
        background-color: #663399;
        color: #fff9;
      }
       }
       /* :first-letter | :first-line */
       p.paragraph { 
         &:first-line {
            background-color: #663399;
        }
        &:first-letter {
         font-size: 4rem;
    }
     } 
     /* :after | :before */
       div.heart {
            position: relative;
            width: 100px;
            height: 90px;
            background-color: #dc143c;
            transform: rotate(-45deg);
            margin-top: 1rem;
        }
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 90px;
            background-color: #dc143c;
        }
        .heart::before {
            top: -50px;
            left: 0;
            border-radius: 50%;
        }
        .heart::after {
            top: 0;
            left: 50px;
            border-radius: 50%;
        }
    
    </style>
</head>
