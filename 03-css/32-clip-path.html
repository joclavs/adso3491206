<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        div.clip {
            background: url(/src/imgs/pittsburgh.jpg) no-repeat center;
            background-size: cover;
            height: 280px;
            margin-block: 1rem;
            margin-inline: auto;
            transition: all 0.4s ease-in;
            width: 320px;
        }
        div.clip1 {
            clip-path: polygon(50% 0, 50% 0, 100% 100%, 0% 100%);
        }
        div.clip2 {
            clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
        }
        div.clip1:hover {
            clip-path: polygon(50% 0%, 100% 0, 98% 35%, 99% 99%, 76% 100%, 48% 100%, 21% 100%, 0 100%, 2% 35%, 0 0);

        }
        div.clip2:hover {
            clip-path: polygon(20% 0%, 0% 20%, 0 50%, 0% 80%, 20% 100%, 49% 100%, 80% 100%, 100% 80%, 100% 50%, 100% 20%, 80% 0%, 50% 0);
        }
    </style>
</head>

            <h1>32-clip-path</h1>
            <img src="/src/imgs/logo-css.png" alt="css">
            <h3>Propiedad que define una región de recorte para mostrar solo una porción específica del elemento (usando formas como circle(), polygon() o rutas SVG).</h3>
        </header>
       <section>
            <h2 class="subtitle">Example 01:</h2>
