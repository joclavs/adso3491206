<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42-parallax</title>
    <link rel="stylesheet" href="../src/css/style.css">
   <style>
        body {
            section {
                div.parallax {
                    border: 2px solid #000;
                    border-radius: 12px;
                    corner-shape: squircle;
                    margin: 0 auto;
                    overflow: hidden;
                    position: relative;
                    width: 360px;
                    height: 576px;

                    div.layer8, div.layer7,
                    div.layer6, div.layer5,
                    div.layer4, div.layer3,
                    div.layer2, div.layer1 {
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 576px;
                        width: 1024px;
                    }

                    div.layer8 { background: url(../src/imgs/layer_08.png) repeat-x;; 
                    }
                    div.layer7 { background: url(../src/imgs/layer_07.png) repeat-x;
                        animation: 40s animLayer linear infinite; 
                    }
                    div.layer6 { background: url(../src/imgs/layer_06.png) repeat-x;
                        animation: 35s animLayer linear infinite; 
                    }
                    div.layer5 { background: url(../src/imgs/layer_05.png) repeat-x;
                        animation: 30s animLayer linear infinite; 
                    }
                    div.layer4 { background: url(../src/imgs/layer_04.png) repeat-x;
                        animation: 25s animLayer linear infinite; 
                    }
                    div.layer3 { background: url(../src/imgs/layer_03.png) repeat-x;
                        animation: 20s animLayer linear infinite; 
                    }
                    div.layer2 { background: url(../src/imgs/layer_02.png) repeat-x;
                        animation: 15s animLayer linear infinite; 
                    }
                    div.layer1 { background: url(../src/imgs/layer_01.png) repeat-x;
                        animation: 5s animLayer linear infinite;
                }

                div.runner {
                        background: url(../src/imgs/running.gif) 
                                    no-repeat center / cover;
                        position: absolute;
                        bottom: 4rem;
                        left: 50%;
                        transform: translatex(-50%) scale(.6);
                        height: 200px;
                        width: 200px;
                    }
                }
            }
        }
        @keyframes animLayer {
            100% { background-position-x: -1024px; }
        }
         @media (min-width: 1024px) {
            body {
                main{
                    width: 80px;
                    section {
                        width: 90px;
                        div.parallax{
                            width: 1024px;
                            }
                    }
                }
            }
        }
    </style>    
</head>
<body class="css">

    <main>
        <header class="mainmenu internal">
            <h1>42-parallax</h1>
            <img src="/src/imgs/logo-css.png" alt="css">
            <h3> Técnica visual donde el fondo se mueve a una velocidad diferente que el contenido en primer plano al desplazarse, creando un efecto de profundidad.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example: </h2>
            <div class="parallax">
                <div class="layer8"></div>
                <div class="layer7"></div>
                <div class="layer6"></div>
                <div class="layer5"></div>
                <div class="layer4"></div>
                <div class="layer3"></div>
                <div class="layer2"></div>
                <div class="layer1"></div>
                <div class="runner"></div>
            </div>
        </section>
        
    </main>
