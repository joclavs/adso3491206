<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/style.css">
     <style>
        section {
            div.jungle {
                background: url(/src/imgs/jungle.png),
                            no-repeat center top /contain;
                height: 460PX;
                margin: 0.4rem auto;
                position: relative;
                overflow: hidden;
                width: 380px;

                img {
                    position: absolute;

                    &.logo {
                        top: 30px;
                        left: 30px;
                        animation: 2.5s animlogo infinite ease;
                    }
                    &.dk {
                        top: 185px;
                        left: 120px;
                        width: 140px;
                        animation: 2s animdk infinite linear;
                    }
                }
                div.move {
                    position: absolute;
                    left: -140px;
                    bottom: 150px;
                    width: 120px;
                    animation: 4s animmove infinite linear;
                    img.ryno {
                        width: 120px;
                        animation: 0.2s animryno infinite ease;
                    }
                }
            }
        }
        @keyframes animlogo {
            0%,100% { transform: scale(0.8); }
            50%     { transform: scale(1.2); }
        }
        @keyframes animdk {
            0%   { transform:  rotatey(0deg)    translatey(0px);   }
            25%  { transform:  rotatey(0deg)    translatey(-80px); }
            50%  { transform:  rotatey(-90deg)  translatey(-80px); }
            75%  { transform:  rotatey(0deg)    translatey(-80px); }
            100% { transform:  rotatey(0deg)    translateY(0px);   }
        }
        @keyframes animryno {
            0%,100% { transform: translatey(0px); }
            50%     { transform: translatey(-4px); }
        }
        @keyframes animmove {
            0%    { transform: rotatey(0deg);   bottom: 150px;   left: -140px;   }
            8%   { transform: rotatey(0deg);    bottom: 150px;   left: 120px;   }
            10%   { transform: rotatey(0deg);   bottom: 220px;   left: 120px;  }
            12%   { transform: rotatey(0deg);   bottom: 150px;   left: 120px; }
            50%   { transform: rotatey(0deg);   bottom: 150px;   left: 400px; }
            51%  { transform: rotatey(-180deg); bottom: 150px;   left: 400px;  }
            52%  { transform: rotatey(-180deg); bottom: 150px;   left: 400px;  }
            60%  { transform: rotatey(-180deg); bottom: 150px;   left: 1200px;  }
            62%  { transform: rotatey(-180deg); bottom: 220px;   left: 120px;  }
            64%  { transform: rotatey(-180deg); bottom: 150px;   left: 120px;  }
            99%  { transform: rotatey(-180deg); bottom: 150px;   left: -140px;  }
            100%  { transform: rotatey(0deg);   bottom: 150px;   left: -140px;  }
        }
    </style>
</head>
<body class="css">

    <main>
        <header class="mainmenu internal">
            <h1>37-animations</h1>
            <img src="/src/imgs/logo-css.png" alt="css">
            <h3>Funcionalidad que utiliza @keyframes para crear secuencias de animación complejas paso a paso sin depender de JavaScript.</h3>
        </header>
        <section>
            <div class="jungle">
                <img src="/src/imgs/logo-dk.png" class="logo">
                <img src="/src/imgs/dk.png" class="dk">
                <div class="move">
                    <img src="/src/imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
