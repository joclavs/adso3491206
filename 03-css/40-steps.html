<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root {
            --size: 256px;
        }
        section{
            div.bg {
                background: url(/src/imgs/bg-steps.png) no-repeat center / cover;
                border-radius: 12px;
                corner-shape: squircle;
                position: relative;
                outline: 4px solid #fff;
                height: 560px;

                div.trainer {
                    background: url(/src/imgs/steps-all.png) no-repeat;
                    background-position-x: 0;
                    transform: scale(0.8);
                    height: 256px;
                    bottom: 0;
                    position: absolute;
                    left: 4rem;
                    width: 256px;

                    animation: 0.6s animaTrainer steps(4) infinite;


                    &.front { background-position-y: calc(var(--size) * 0) ;}
                    &.left { background-position-y: calc(var(--size) * -1) ;}
                    &.right { background-position-y: calc(var(--size) * -2) ;}
                    &.back { background-position-y: calc(var(--size) * -3) ;}
                }
            }
        }
        @keyframes animaTrainer {
            100% { background-position-x: calc(var(--size) * -4) }
        }
    </style>
</head>

        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>40-steps</h1>
            <img src="/src/imgs/logo-css.png" alt="css">
            <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
        </header>
        <section>
            <h2 class="subtitle">Ejemplo de uso</h2>
            <div class="bg">
                <div class="trainer front"></div>
            </div>
        </section>
