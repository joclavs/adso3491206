<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/style.css">
      <style>
        :root {
            --size: 256px;
        }
        body {
            overflow: hidden;
        }

        section {
            div.bg {
                background: url(/src/imgs/bg-steps.png) no-repeat center / cover;
                border-radius: 12px;
                outline: 4px solid white;
                corner-shape: squircle;
                position: relative;
                height: 540px;

                div.info {
                    background-color: rgba(0, 0, 0, 0.644);
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    font-size: 1.6rem;
                    text-align: center;
                    position: absolute;
                    top: 0.8rem;
                    left: 0.8rem;
                    padding: 0.4rem;
                    width: 340px;
                }

                div#trainer {
                    background: url(/src/imgs/steps-all.png) no-repeat;
                    position: absolute;
                    bottom: 0;
                    left: 4rem;
                    transform: scale(.8);
                    height: var(--size);
                    width: var(--size);

                    animation: anim 0.6s steps(4) infinite;

                    &.front {
                        background-position-y: 0;
                    }

                    &.left {
                        background-position-y: calc(var(--size) * -1);
                    }

                    &.right {
                        background-position-y: calc(var(--size) * -2);
                    }

                    &.back {
                        background-position-y: calc(var(--size) * -3);
                    }
                }
            }
        }

        @keyframes anim {
            100% {
                background-position-x: calc(var(--size) * -4);
            }
        }
</style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>40-steps</h1>
            <img src="/src/imgs/logo-css.png" alt="css">
           <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example: </h2>
            <div class="bg">
                <div class="info">
                    Presione las teclas <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div id="trainer" class="front"></div>
            </div>
        </section>
    </main>
   <script>
        const trainer = document.getElementById('trainer');

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    trainer.className = 'front';
                    break;
                case 'ArrowDown':
                    trainer.className = 'back';
                    break;
                case 'ArrowLeft':
                    trainer.className = 'left';
                    break;
                case 'ArrowRight':
                    trainer.className = 'right';
                    break;
            }
        });
    </script>
</body>
