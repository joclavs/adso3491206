<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #a4b7dc;
    padding: 10px;
}

/* Contenedor principal */

.galeria {
    width: 100%;
    max-width: 748px;
    margin: auto;

    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 263px);

    gap: 6px;

    grid-template-areas:
        "demon attack kenshin"
        "jujutsu attack solo"
        "slam slam chainsaw";
}

/* Estilos generales de las imágenes */

.imagen {
    border: 4px solid white;
    border-radius: 12px;
    overflow: hidden;
}

.imagen img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/* Ubicación de cada imagen */

.demon {
    grid-area: demon;
}

.attack {
    grid-area: attack;
}

.kenshin {
    grid-area: kenshin;
}

.jujutsu {
    grid-area: jujutsu;
}

.solo {
    grid-area: solo;
}

.slam {
    grid-area: slam;
}

.chainsaw {
    grid-area: chainsaw;
}

/* Adaptación para pantallas pequeñas */

@media (max-width: 550px) {
    .galeria {
        grid-template-rows: repeat(3, 180px);
        gap: 5px;
    }

    .imagen {
        border-width: 3px;
        border-radius: 8px;
    }
}</style>
    
</head>
