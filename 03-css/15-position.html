<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-position</title>
    <link rel="stylesheet" href="../src/css/style.css">
     <style>
        section {
            div {
                background-color: #ab7dd5;
                border: 2px solid #fff;
                height: 400px;
                margin: 1rem auto;
                position: relative;
                width: 360px;

                img {
                    width: 80px;
                }
                &.pos01 img {
                    position: static;
                }
                &.pos02 img {
                    position: relative;
                    top: 50px;
                    left: 50px;
                }
                &.pos03 img {
                    position: absolute;
                    bottom: 20px;
                    right: 20px;
                }
                &.pos04 {
                    transform: translate(0);
                    img {
                        position: fixed;
                        top: 20px;
                        right: 20px;
                    }
                }
                &.pos05 img {
                    position: sticky;
                    top: 20px;
                }
            }
        }
    </style>
</head>
