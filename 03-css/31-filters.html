<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            .filter {
                display: block;
                margin: 1rem auto;
                width: 160px;
                height: 300px;
                transition: all 0.4s ease-in;
                
                &.filter1 {
                    filter: grayscale(100%);
                }
                &.filter2 {
                    filter: blur(80px);
                }
                &.filter3 {
                    filter: sepia(100%);
                }
                &.filter4 {
                    filter: brightness(50%);
                }
                &.filter5 {
                    filter: invert(100%);
                }
                &.filter6 {
                    filter: drop-shadow(16px 16px 20px red);
                }
                &.filter7 {
                    filter: hue-rotate(125deg);
                }
                &:hover {
                    filter: none;
                  }  
            }
        }
    </style>
</head>
